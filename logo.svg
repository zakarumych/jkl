<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4bd1fe"/>
      <stop offset="100%" stop-color="#ff41bd"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1440" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#ff4e50"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="600" rx="50" fill="#444"/>

  <!-- Jackal silhouette built from progressively degraded pixel blocks -->
  <!-- Left ear -->
  <rect x="84" y="84" width="33" height="33" fill="#3a7"/>
  <rect x="84" y="120" width="33" height="33" fill="#3a7"/>
  <rect x="120" y="48" width="33" height="33" fill="#3a7"/>
  <rect x="156" y="84" width="33" height="33" fill="#3a7"/>
  <rect x="120" y="84" width="33" height="33" fill="#387"/>
  <rect x="120" y="120" width="33" height="33" fill="#387"/>
  <!-- Right ear -->
  <rect x="264" y="48" width="33" height="33" fill="#3a7"/>
  <rect x="228" y="84" width="33" height="33" fill="#3a7"/>
  <rect x="264" y="84" width="33" height="33" fill="#387"/>
  <rect x="264" y="120" width="33" height="33" fill="#387"/>
  <rect x="300" y="84" width="33" height="33" fill="#3a7"/>
  <rect x="300" y="120" width="33" height="33" fill="#3a7"/>
  <!-- Head -->
  <!-- <rect x="84" y="156" width="33" height="33" fill="#386"/> -->
  <rect x="120" y="192" width="33" height="33" fill="#386"/>
  <rect x="120" y="156" width="33" height="33" fill="#333"/>
  <rect x="156" y="120" width="33" height="33" fill="#386"/>
  <rect x="192" y="120" width="33" height="33" fill="#386"/>
  <rect x="192" y="156" width="33" height="33" fill="#3a7"/>
  <rect x="228" y="120" width="33" height="33" fill="#386"/>
  <rect x="264" y="156" width="33" height="33" fill="#333"/>
  <!-- <rect x="300" y="156" width="33" height="33" fill="#386"/> -->
  <rect x="264" y="192" width="33" height="33" fill="#386"/>
  <!-- Eyes (dark pixels) -->
  <rect x="156" y="156" width="33" height="33" fill="#924"/>
  <rect x="228" y="156" width="33" height="33" fill="#924"/>
  <!-- Snout -->
  <rect x="156" y="192" width="33" height="33" fill="#3a7"/>
  <rect x="192" y="192" width="33" height="33" fill="#333"/>
  <rect x="228" y="192" width="33" height="33" fill="#3a7"/>
  <!-- Body (gets progressively more "jackalled" - blocky and color-banded) -->
  <rect x="126" y="228" width="39" height="39" fill="#386"/>
  <rect x="168" y="228" width="39" height="39" fill="#3a7"/>
  <rect x="210" y="228" width="39" height="39" fill="#3a7"/>
  <rect x="252" y="228" width="39" height="39" fill="#386"/>
  <rect x="162" y="270" width="45" height="45" fill="#387"/>
  <rect x="162" y="318" width="51" height="51" fill="#387"/>
  <!-- Legs (very degraded, large blocks, few colors) -->
  <rect x="108" y="318" width="51" height="51" fill="#386"/>
  <rect x="108" y="372" width="51" height="51" fill="#3a7"/>
  <rect x="114" y="270" width="45" height="45" fill="#386"/>
  <rect x="210" y="270" width="45" height="45" fill="#386"/>
  <rect x="216" y="318" width="51" height="51" fill="#386"/>
  <rect x="216" y="372" width="51" height="51" fill="#3a7"/>
  <rect x="258" y="270" width="45" height="45" fill="#386"/>
  <rect x="270" y="318" width="51" height="51" fill="#386"/>
  <rect x="282" y="372" width="51" height="51" fill="#3a7"/>
  <!-- Tail (almost gone, max jackalling) -->
  <rect x="306" y="246" width="57" height="57" fill="#3a7"/>
  <rect x="366" y="210" width="63" height="63" fill="#3a7"/>

  <!-- Compression quality scale: 1..10 jackality -->
  <rect x="30" y="480" width="424" height="10" rx="6" fill="#333"/>
  <rect x="30" y="480" width="424" height="10" rx="6" fill="url(#g1)" opacity="0.5"/>
  <text x="30" y="525" font-family="Consolas" font-size="30" fill="#666">1</text>
  <text x="420" y="525" font-family="Consolas" font-size="30" fill="#666">10</text>
  <text x="126" y="525" font-family="Consolas" font-size="26" fill="#555">jackality scale</text>

  <!-- J K L -->
  <text x="760" y="240" font-family="Consolas" font-size="300" font-weight="bold" fill="url(#g2)" text-anchor="middle" letter-spacing="48">J</text>
  <text x="1040" y="240" font-family="Consolas" font-size="300" font-weight="bold" fill="url(#g2)" text-anchor="middle" letter-spacing="48">K</text>
  <text x="1320" y="240" font-family="Consolas" font-size="300" font-weight="bold" fill="url(#g2)" text-anchor="middle" letter-spacing="48">L</text>

  <!-- Decorative artifact blocks (right side, progressive degradation) -->
  <rect x="1060" y="360" width="24" height="24" fill="url(#g2)" opacity="0.6"/>
  <rect x="1096" y="360" width="30" height="30" fill="url(#g2)" opacity="0.5"/>
  <rect x="1138" y="360" width="36" height="36" fill="url(#g2)" opacity="0.4"/>
  <rect x="1186" y="360" width="42" height="42" fill="url(#g2)" opacity="0.3"/>
  <rect x="1240" y="360" width="48" height="48" fill="url(#g2)" opacity="0.2"/>
  <rect x="1300" y="360" width="60" height="60" fill="url(#g2)" opacity="0.1"/>

  <!-- tagline -->
  <text x="1020" y="480" font-family="Consolas" font-size="40" fill="#888" text-anchor="middle">blazingly fast compression</text>

  <!-- subtle wink -->
  <text x="1020" y="550" font-family="Consolas" font-size="26" fill="#666" text-anchor="middle">jackal responsibly</text>
</svg>
