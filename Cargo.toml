[workspace]
members = ["cli", "gui", "experiments"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hashbrown = "0.16"
bitvec = "1.0"
bytemuck = { version = "1.0" }
rand = "0.10"
egui = "0.33"
eframe = "0.33"
image = "0.25.8"

[package]
name = "jkl"
description = "Texture compression and packing tool"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hashbrown.workspace = true
rand.workspace = true
